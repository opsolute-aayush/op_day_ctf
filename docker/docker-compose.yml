services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env — generate with: openssl rand -base64 48}"
    volumes:
      - opday_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dns:
    profiles: ["dns"]
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache dnsmasq
        ENTRYPOINT ["sh", "-c", "if [ -z \"$$HOST_IP\" ]; then echo 'ERROR: HOST_IP is not set — add it to .env (this machine'\"'\"'s LAN IP)' >&2; exit 1; fi; printf 'address=/aegios.co.in/%s\\naddress=/www.aegios.co.in/%s\\n' \"$$HOST_IP\" \"$$HOST_IP\" > /etc/dnsmasq.conf && exec dnsmasq -k --log-queries"]
    restart: unless-stopped
    environment:
      HOST_IP: "${HOST_IP:-}"
    ports:
      - "53:53/udp"
      - "53:53/tcp"

volumes:
  opday_data:
