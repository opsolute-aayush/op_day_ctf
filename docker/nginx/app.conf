# Reverse proxy in front of the app container, terminating TLS for
# aegios.co.in. Port 80 only ever answers the Let's Encrypt renewal
# challenge and redirects everything else to https.
server {
    listen 80;
    server_name aegios.co.in www.aegios.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aegios.co.in www.aegios.co.in;

    # docker/certbot-init.sh writes a temporary self-signed cert here first
    # (so nginx has something to start with), then replaces it with the
    # real Let's Encrypt one — this path never changes either way.
    ssl_certificate     /etc/letsencrypt/live/aegios.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegios.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
