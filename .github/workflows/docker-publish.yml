name: Build and push Docker image

# Mirrors the manual release step: build the same docker/Dockerfile for
# linux/amd64 (what docker-compose.prod.yml and the EC2 host run) and push
# it to Docker Hub as aayushop/opday-ctf:latest. Watchtower on the host
# polls that tag every 5 minutes and redeploys automatically — no manual
# `docker buildx build --push` needed anymore.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: aayushop/opday-ctf

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
