name: Build and push Docker image

# Runs the exact same command used to release by hand — see README.md's
# "Deploying a change" section:
#
#   docker buildx build --platform linux/amd64 -f docker/Dockerfile \
#     -t aayushop/opday-ctf:latest --push .
#
# linux/amd64 because that's what docker-compose.prod.yml and the EC2 host
# run — GitHub's ubuntu-latest runner is already amd64, so this builds
# natively (no QEMU emulation needed, unlike doing this on Apple Silicon).
# Watchtower on the host polls the "latest" tag every 5 minutes and
# redeploys on its own once a new image lands.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 -f docker/Dockerfile \
            -t aayushop/opday-ctf:latest --push .
